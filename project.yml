name: Terminal
options:
  bundleIdPrefix: com.terminal
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.12.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.99.0
  Runestone:
    url: https://github.com/simonbs/Runestone
    from: 0.5.0
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.7
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3

targets:
  Terminal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Terminal
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terminal.app
        PRODUCT_NAME: Terminal
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Terminal/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Citadel
        product: Citadel
      - package: SwiftTerm
        product: SwiftTerm
      - package: Runestone
        product: Runestone
      - package: NIOSSH
        product: NIOSSH
      - package: NIO
        product: NIO
      - package: swift-crypto
        product: Crypto

  TerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TerminalTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.terminal.app.tests
    dependencies:
      - target: Terminal

schemes:
  Terminal:
    build:
      targets:
        Terminal: all
        TerminalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TerminalTests
    archive:
      config: Release
